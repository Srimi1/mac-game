name: BreakTheQuietDays
options:
  bundleIdPrefix: com.srimi
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Break the Quiet Days"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.games"
    INFOPLIST_KEY_NSHumanReadableCopyright: "Original game by srimi"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: "-"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  BreakTheQuietDays:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Resources
      - path: Sources/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srimi.BreakTheQuietDays
        PRODUCT_NAME: "Break the Quiet Days"
        PRODUCT_MODULE_NAME: BreakTheQuietDays
    scheme:
      testTargets:
        - BreakTheQuietDaysTests
        - BreakTheQuietDaysUITests
  BreakTheQuietDaysTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: BreakTheQuietDays
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srimi.BreakTheQuietDaysTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Break the Quiet Days.app/Contents/MacOS/Break the Quiet Days"
        BUNDLE_LOADER: "$(TEST_HOST)"
  BreakTheQuietDaysUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - TestsUI
    dependencies:
      - target: BreakTheQuietDays
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srimi.BreakTheQuietDaysUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BreakTheQuietDays
